preprocessing_policy:
  immutable_source: retain byte-for-byte
  author_workflow_repository: https://github.com/beyondpie/CEMBA_wmb_snATAC
  author_workflow_commit: 4605d86a83fe45a38e656ba87df85fe99762f358
  author_snaptools_repository: https://github.com/r3fang/SnapTools
  author_snaptools_commit: eecfa5653020b80e31eed1ae5d2b13068e17a2df
  author_snaptools_version: 1.4.8
  alignment: BWA-MEM 0.7.17-r1188 against UCSC mm10/GRCm38 initial, streamed directly into pysam 0.24.0 with embedded samtools 1.23.1 name sorting; restore the ENA second header field as the original barcode-first QNAME before streaming
  alignment_threads: 1
  alignment_sort_extra_threads: 0
  alignment_runnable_cpu_processes_max: 3
  alignment_cpu_cores_max: 2
  alignment_logical_cpu_affinity: [6, 7]
  alignment_storage: no normalized FASTQ or plain SAM is materialized; only the temporary name-sorted BAM is retained until fragment validation
  alignment_thread_departure: author used 4 threads; one thread changes resources only and protects the co-tenant workload
  fragment_construction: SnapATAC2 2.4.0 make_fragment_file with is_paired=true, barcode_regex='^(\w+):.+', min_mapq=30, shift_left=4, shift_right=-5, and deduplication
  fragment_sort_chunk_size: 5000000
  fragment_chunk_departure: lower than the 2.4.0 default to bound memory; affects external sort chunking, not filtering, coordinates, or deduplication semantics
  normalized_fastq_storage: none; validated normalization is streamed to BWA and immutable raw FASTQs remain unchanged
  cell_filter: retain only deposited H5AD observation barcodes and exact SI-Table-2 annotations
  temporary_bam_location: data/work/preprocessing/gse246791_mouse_brain_reference/<gsm>/alignment/name_sorted.bam
  final_fragment_location: data/processed/shapemix/gse246791_mouse_brain_reference/normalized_fragments/<gsm>
  representative_concordance_gate:
    require_all_h5ad_barcodes_present: true
    median_absolute_relative_error_max: 0.02
    p95_absolute_relative_error_max: 0.10
    spearman_r_min: 0.98
validation_gates:
  - exact ENA byte size and MD5 for every paired FASTQ
  - complete gzip streams and project SHA-256 lock
  - paired read IDs and cell-barcode encoding match between mates
  - mm10 coordinate, proper-pair, MAPQ, duplicate, and Tn5-shift audit
  - retained fragment barcodes map exactly to deposited H5AD observations
  - reconstructed per-cell unique-fragment counts agree with deposited n_fragment within the frozen tolerance
download_workers_max: 4
validation_workers_max: 2
