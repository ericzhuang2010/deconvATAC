  - samples: [GSM8494157, GSM8494158, GSM8494159]
    field: tissue
    geo_value: Embryo
    publication_value: five-month-old EAE mouse brain
    resolution: resolved from the primary publication and the deposited 5M sample naming; retain this discrepancy in provenance
reference_candidates:
  mouse_embryo_whole:
    accession: GSE216371
    status: audit_only
    caveat: the E10.5-E13.5 whole-embryo atlas has cell-level labels and mm10 fragment BED files; pooled SPATAC barcode and parent-fragment semantics must pass a reference audit
  mouse_brain:
    accession: GSE246791
    status: audit_only
    caveat: processed per-sample H5AD objects retain raw mm10 fragments, but labels, EAE compatibility, and parent-fragment semantics must pass a reference audit
    fallback_accession: GSE111586
    fallback_caveat: processed matrices use mm9 and lack fragment lengths; raw-read reconstruction and mm10 realignment are required
preprocessing_policy:
  raw_archive: retain byte-for-byte and extract only into the processed family tree
  atac_only_for_shapemix: true
  cut_and_tag_and_protein: validation_only
  normalize_fragments: BGZF plus tabix without modifying source archive
  coordinate_system: zero-based half-open intervals as deposited; audit Tn5 endpoint convention separately
  spatial_assets: safely extract images, scale factors, and tissue positions
  rna_and_protein: convert deposited pixel matrices to sparse H5AD where schemas permit
  cross_modality: compare exact pixel identifiers within each declared sample group
  feature_axis: must come from a compatible frozen single-cell ATAC reference
  truth_policy: no exact proportions; store orthogonal validation only
validation_gates:
  - exact archive byte size and SHA-256
  - complete tar stream and safe member paths
  - complete gzip streams for every compressed member
  - full fragment-schema, coordinate-order, assay, and barcode audit
  - exact spatial coordinate and modality pixel reconciliation
  - no CUT&Tag fragment file may enter ShapeMix layers
  - preserve the GEO-versus-publication five-month EAE tissue discrepancy in provenance
  - no runnable ShapeMix dataset before a compatible labeled reference passes
