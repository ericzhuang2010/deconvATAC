standardized_reference_id: gse216371_mouse_embryo_e13_major_types_v1
selection:
  policy: retain every author-annotated E13.5 cell from all 68 combinatorial wells
  label_resolution: frozen broad major-cell-type ontology derived from the author annotation workbook
  rationale: matches the whole-embryo scope and stage of the real-spatial E13 sections
broad_ontology:
  ontology_version: major_types_v1
  frozen_after_author_audit: '2026-08-27'
  ordered_cell_types:
    - Mesenchymal
    - Chondro-osteogenic
    - Muscle
    - Endothelial
    - Epithelial
    - Hepatocyte
    - Erythroid
    - Immune
    - Neural progenitor/regional CNS
    - Excitatory neuron
    - Inhibitory neuron
    - Peripheral/sensory/motor neural
  minimum_cells_per_type: 500
  author_main_cluster_mapping:
    Amniochorionic mesoderm A: Mesenchymal
    Amniochorionic mesoderm B: Mesenchymal
    Anterior floor plate: Neural progenitor/regional CNS
    Cardiac muscle lineage: Muscle
    Chondrocyte and osteoblast progenitors: Chondro-osteogenic
    Connective tissue progenitors: Mesenchymal
    Definitive erythroid lineage: Erythroid
    Di/mesencephalon excitatory neurons: Excitatory neuron
    Di/mesencephalon inhibitory neurons: Inhibitory neuron
    Di/telencephalon: Neural progenitor/regional CNS
    Early chondrocytes: Chondro-osteogenic
    Endothelial cells: Endothelial
    Epithelial cells: Epithelial
    Hepatocytes: Hepatocyte
    Hindbrain: Neural progenitor/regional CNS
    Inhibitory interneurons: Inhibitory neuron
    Intermediate mesoderm: Mesenchymal
    Intermediate progenitor cells: Neural progenitor/regional CNS
    Limb mesenchyme progenitors: Mesenchymal
    Mesencephalon/MHB: Neural progenitor/regional CNS
    Motor neurons: Peripheral/sensory/motor neural
    Myocytes: Muscle
    Neural crest (PNS glia): Peripheral/sensory/motor neural
    Neural crest (PNS neurons): Peripheral/sensory/motor neural
    Neuron progenitor cells: Neural progenitor/regional CNS
    Noradrenergic neurons: Peripheral/sensory/motor neural
    Olfactory sensory neurons: Peripheral/sensory/motor neural
    Osteoblast progenitors A: Chondro-osteogenic
    Osteoblast progenitors B: Chondro-osteogenic
    Posterior floor plate: Neural progenitor/regional CNS
    Primitive erythroid lineage: Erythroid
    Retinal neurons: Peripheral/sensory/motor neural
    Retinal pigment cells: Epithelial
    Retinal primordium: Neural progenitor/regional CNS
    Roof plate: Neural progenitor/regional CNS
    Skeletal muscle progenitors: Muscle
    Somatic mesoderm: Mesenchymal
    Spinal cord (dorsal): Neural progenitor/regional CNS
    Spinal cord (ventral): Neural progenitor/regional CNS
