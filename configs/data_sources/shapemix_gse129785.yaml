download_policy:
  fragment_url_template: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM3722nnn/{gsm}/suppl/{gsm}_{title}_fragments.tsv.gz
  staging_suffix: .part
  require_content_length: true
  require_gzip_integrity: true
  require_five_column_fragment_schema: true
  atomic_promotion: true

preprocessing_policy:
  author_peak_coordinates: one-based closed feature labels normalized to zero-based half-open intervals [start - 1, end)
  reference_cell_calls: author Hematopoiesis-All barcode table
  preparation_cell_calls: matching author PBMC barcode tables where raw barcodes are present
  dilution_cell_calls: explicit fragment-depth rule calibrated against author-filtered immune samples
  peak_selection: 5000 reference-only peaks using ShapeMix protocol-v1 variance score
  normalized_fragment_storage: hard-link 29 BGZF sources; atomically recompress plain-gzip GSM3722026 as derived BGZF; create derived tabix indexes
  barcode_namespace: <GSM>#<raw_barcode>
  read_support_policy: ignored for ShapeMix counts; retained in source audit only
  physical_truth: nominal sample-level proportions; not exact per-cell truth
  cross_build_policy: keep first benchmark in hg19; do not lift over fragment intervals

validation_gates:
  - exact source byte size and SHA-256
  - gzip/BGZF integrity and five-column fragment schema
  - official barcode membership or documented fallback cell calling
  - author matrix dimensions and ordered axes
  - right-cut coordinate convention against author counts
  - nonnegative integer CSR layers whose exact sum equals X
  - identical ordered selected-peak axis in reference and mixtures
