preprocessing_policy:
  processed_h5ad: retain immutable gzip and decompress atomically into processed source_object
  original_fragments: retain all 13 author Cell Ranger ARC fragment/index/metrics trios from the Open Problems post-competition bucket
  original_bams: freeze all authoritative NCBI URLs and identities as reconstruction fallback; do not download when the fragment suite validates
  fragment_reconstruction_fallback: use author Cell Ranger ARC coordinate-sorted BAM, corrected CB tag, proper primary pairs, MAPQ at least 30, exclude QC-fail/secondary/supplementary/duplicate reads, apply Tn5 left +4 and right -5 shifts, emit one deduplicated five-column fragment row
  pilot: GSM5828489 (smallest authoritative BAM; Site 3 Donor 6)
  labels: preserve author annotations and emit an explicit harmonized label table
  folds: materialize donor/site index tables only; learn peaks and signatures from training donors downstream
validation_gates:
  - exact GEO byte sizes and full gzip integrity
  - all 13 unique GSM/SRX/SRR/BioSample/BAM identities match the NCBI metadata snapshot
  - processed H5AD cell, feature, modality, label, donor, and site audit
  - all 13 fragment/index/metrics trios match frozen S3 sizes and ETags and pass integrity/schema checks
  - exact pilot processed-cell barcode reconciliation
  - pilot depth-normalized count containment establishes fragment and cut-coordinate semantics before the remaining fragment products are retained
  - no held-out donor contributes to feature selection or signature estimation
