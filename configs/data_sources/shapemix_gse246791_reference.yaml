preprocessing_policy:
  immutable_source: retain byte-for-byte
  decompress_h5ad_to: data/processed/shapemix/gse246791_mouse_brain_reference/source_objects
  peak_selection: reference-only ranking on the selected samples
  fragment_bins_bp: [[0, 100], [100, 250], [250, null]]
  right_cut_offset: audit against the deposited 500-bp matrices before freezing
  truth_policy: reference labels are not spatial composition truth
validation_gates:
  - exact remote byte size and complete gzip streams
  - exact reproducibility of the frozen SI-Table-1 subset rule
  - exact selected-cell mapping to SI Table 2
  - mm10 coordinate and parent-fragment validation
  - one selected sample for every declared major region
  - nonnegative integer CSR layers whose sum equals X
download_workers_max: 2
