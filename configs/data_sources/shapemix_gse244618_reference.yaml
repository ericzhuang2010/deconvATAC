preprocessing_policy:
  immutable_source: retain byte-for-byte
  peak_selection: reference-only ranking from author cCREs
  label_resolution: freeze an author-taxonomy broad ontology after the source audit and before feature selection
  fragment_bins_bp: [[0, 100], [100, 250], [250, null]]
  right_cut_offset: audit BEDPE coordinate semantics against the author specification before freezing
  truth_policy: reference labels are not spatial composition truth
validation_gates:
  - exact remote byte size and complete gzip streams
  - exact donor-by-region subset and technical-replicate exclusion
  - exact BEDPE barcode mapping to Table S3
  - GRCh38 coordinate and parent-fragment validation
  - broad-label support in every retained donor
  - nonnegative integer CSR layers whose sum equals X
download_workers_max: 2
