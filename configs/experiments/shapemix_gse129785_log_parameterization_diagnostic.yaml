description: >-
  Development-only validation of scale-invariant log-abundance optimization
  on one representative frozen GSE129785 dilution. Biological ratios are not
  used for implementation selection.
benchmark_scope: development_log_parameterization_diagnostic
protocol:
  name: shapemix_gse129785_log_parameterization_diagnostic
  version: 1
  frozen_date: "2026-08-25"
run_group: shapemix_gse129785_log_parameterization_diagnostic_v1
datasets:
  - gse129785_shapemix_physical_dilution_0p1_99p9_cd4mem_cd8naive
modalities:
  - atac
feature_sets:
  atac:
    - selected_reference_peaks
method_runs:
  - id: shapemix_length_log_parameterization
    method: shapemix
    config: configs/methods/shapemix.yaml
  - id: shapemix_count_only_log_parameterization
    method: shapemix
    config: configs/methods/shapemix_count_only.yaml
evaluation_mode: prediction_only
metrics: []
output_root: results/development/shapemix_gse129785_convergence_v1
run_id_template: "{dataset}__{modality}__{feature_set}__{method_run_id}"
skip_missing: false
continue_on_error: false
overwrite: false
