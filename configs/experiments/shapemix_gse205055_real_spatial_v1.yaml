description: >-
  Prediction-only ShapeMix evaluation on six GSE205055 spatial ATAC sections
  with independently frozen RNA and histone/anatomical validation evidence.
benchmark_scope: real_spatial_orthogonal_validation
protocol:
  name: shapemix_full_evaluation
  version: 1
  frozen_date: "2026-08-26"
  analysis_unit: independently_prepared_section
  exact_composition_truth: false
run_group: shapemix_gse205055_real_spatial_protocol_v1_cuda
datasets:
  - gse205055_shapemix_mouse_brain_p21_20um_primary_v1
  - gse205055_shapemix_mouse_embryo_e13_25um_v1
  - gse205055_shapemix_mouse_brain_p21_20um_rep2_v1
  - gse205055_shapemix_mouse_brain_p22_20um_100barcodes_rep2_v1
  - gse205055_shapemix_mouse_embryo_e13_50um_v1
  - gse205055_shapemix_human_hippocampus_50um_v1
modalities: [atac]
feature_sets:
  atac: [all]
method_runs:
  - id: shapemix_length
    method: shapemix
    config: configs/methods/shapemix_cuda.yaml
  - id: shapemix_count_only
    method: shapemix
    config: configs/methods/shapemix_count_only_cuda.yaml
  - id: nnls
    method: nnls
    config: configs/methods/nnls.yaml
evaluation_mode: prediction_only
metrics: []
output_root: results/real_spatial/shapemix_gse205055_v1
run_id_template: "{dataset}__{modality}__{feature_set}__{method_run_id}"
skip_missing: false
continue_on_error: true
overwrite: false
