description: >-
  Prediction-only ShapeMix evaluation on the embryo and five-month EAE-brain
  GSE263333 spatial ATAC sections with independent multi-omic validation.
benchmark_scope: real_spatial_orthogonal_validation
protocol:
  name: shapemix_full_evaluation
  version: 1
  frozen_date: "2026-08-26"
  analysis_unit: independently_prepared_section
  exact_composition_truth: false
run_group: shapemix_gse263333_real_spatial_protocol_v1_cuda
datasets:
  - gse263333_shapemix_mouse_embryo_e13_50um_atac_v1
  - gse263333_shapemix_five_month_eae_brain_20um_atac_v1
modalities: [atac]
feature_sets:
  atac: [all]
method_runs:
  - id: shapemix_length
    method: shapemix
    config: configs/methods/shapemix_cuda.yaml
  - id: shapemix_count_only
    method: shapemix
    config: configs/methods/shapemix_count_only_cuda.yaml
  - id: nnls
    method: nnls
    config: configs/methods/nnls.yaml
evaluation_mode: prediction_only
metrics: []
output_root: results/real_spatial/shapemix_gse263333_v1
run_id_template: "{dataset}__{modality}__{feature_set}__{method_run_id}"
skip_missing: false
continue_on_error: true
overwrite: false
