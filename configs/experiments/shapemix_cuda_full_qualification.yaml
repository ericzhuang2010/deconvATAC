description: >-
  Development-only CPU/CUDA performance, numerical-parity, repeat-determinism,
  and cached/streamed qualification on one representative 1024 by 5000 input.
benchmark_scope: development_cuda_qualification
protocol_version: 1
run_group: full_size
datasets:
  - pbmc_granulocyte_sorted_10k_shapemix_equal_celltype_split_1103_mix_101
modalities:
  - atac
feature_sets:
  atac:
    - highly_variable
method_runs:
  - id: shapemix_length_cpu
    method: shapemix
    config: configs/methods/shapemix.yaml
  - id: shapemix_length_cuda_cached
    method: shapemix
    config: configs/methods/shapemix_cuda.yaml
  - id: shapemix_length_cuda_cached_repeat
    method: shapemix
    config: configs/methods/shapemix_cuda.yaml
  - id: shapemix_length_cuda_streamed
    method: shapemix
    config: configs/methods/shapemix_cuda_streamed.yaml
metrics:
  - rmse_v1
  - jsd_v2
output_root: results/development/shapemix_gpu_qualification_v1
run_id_template: "{dataset}__{modality}__{feature_set}__{method_run_id}"
skip_missing: false
continue_on_error: false
overwrite: false
