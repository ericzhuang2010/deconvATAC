      title: PBMC_Rep3
      role: pbmc_evaluation
      replicate: 3
    - gsm: GSM3722077
      srx: SRX5679947
      title: PBMC_Rep4
      role: pbmc_evaluation
      replicate: 4
  modalities:
    atac:
      reference:
        path: data/processed/references/gse129785_immune/atac/reference.h5ad
      spatial:
        path: data/processed/datasets/gse129785_shapemix_pbmc_replicates/atac/spatial.h5ad
