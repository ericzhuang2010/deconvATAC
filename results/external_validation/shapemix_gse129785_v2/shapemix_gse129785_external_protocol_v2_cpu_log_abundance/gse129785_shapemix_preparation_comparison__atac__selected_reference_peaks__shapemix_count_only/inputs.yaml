          matrix_match: exact
          mismatched_entries: 0
          absolute_error: 0
        bins:
        - name: short
          min_inclusive: 0
          max_exclusive: 100
          layer: fragment_length_lt_100
        - name: mono
          min_inclusive: 100
          max_exclusive: 250
          layer: fragment_length_100_249
        - name: long
          min_inclusive: 250
          max_exclusive: null
          layer: fragment_length_ge_250
      feature_sets:
        all:
          mode: all
        selected_reference_peaks:
          path: data/processed/datasets/gse129785_shapemix_preparation_comparison/atac/features/selected_reference_peaks.txt
