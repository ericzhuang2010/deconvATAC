dataset_config:
  dataset_id: gse129785_shapemix_preparation_comparison
  source: GSE129785 PBMC preparation comparison
  description: Fresh, frozen-sorted, and frozen-unsorted PBMC scATAC samples, aggregated
    to one deconvolution spot per preparation.
  labels_key: cell_type
  spatial_key: spatial
  benchmark_scope: external_unlabelled_evaluation
  shapemix_seeds:
    outer_split_seed: 0
    inner_mixture_seed: 0
  evaluation_design:
    comparison_key: preparation
    truth_limitation: No quantitative cell-type truth is published for these samples;
      use concordance and robustness endpoints only.
    samples:
    - gsm: GSM3722040
      srx: SRX5679910
      title: Fresh_pbmc_5k
      role: preparation_evaluation
      preparation: fresh
    - gsm: GSM3722041
      srx: SRX5679911
      title: Frozen_sorted_pbmc_5k
      role: preparation_evaluation
      preparation: frozen_sorted
    - gsm: GSM3722042
      srx: SRX5679912
      title: Frozen_unsorted_pbmc_5k
      role: preparation_evaluation
      preparation: frozen_unsorted
  modalities:
    atac:
      reference:
        path: data/processed/references/gse129785_immune/atac/reference.h5ad
      spatial:
        path: data/processed/datasets/gse129785_shapemix_preparation_comparison/atac/spatial.h5ad
      labels_key: cell_type
      spatial_key: spatial
      cell_types:
